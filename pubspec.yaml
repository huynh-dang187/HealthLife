name: healthlife
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.de
version: 1.0.0+1

environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.2.0
  firebase_messaging: ^16.1.2

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Router
  go_router: ^15.1.2

  # Local storage
  shared_preferences: ^2.3.4

  # UI helpers
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  lottie: ^3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  hive_ce_generator: ^1.4.0
  flutter_gen_runner: ^5.15.0

flutter_gen:
  output: lib/generated/
  line_length: 80

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/intro/
    - assets/svg/
    - assets/png/
